name: python
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    if: false
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      - name: install ./...
        run: go install ./...
      - uses: actions/checkout@v6
        with:
          repository: sqlc-dev/sqlc-gen-python
          path: python
      - run: make test
        working-directory: python
      - run: sqlc diff
        working-directory: python/examples

  python:
    name: python
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - name: require the job to have succeeded or been skipped
      run: |
        set -euo pipefail
        result='${{ needs.build.result }}'
        case "$result" in
          success|skipped) echo "build: $result" ;;
          *) echo "::error::build reported: $result"; exit 1 ;;
        esac
