name: go
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  version-sync:
    name: version sync
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26.4'

    - name: generated files match info.Version
      run: |
        set -euo pipefail
        want=$(go run ./cmd/dsql version)
        found=$(grep -rhoE '^//   dsqlsea v[0-9]+\.[0-9]+\.[0-9]+' \
          internal/endtoend/testdata examples | sort -u || true)
        if [ -z "$found" ]; then
          echo "::error::found no version headers to check — has the header format changed?"
          exit 1
        fi
        bad=$(echo "$found" | grep -v "^//   dsqlsea ${want}$" || true)
        if [ -n "$bad" ]; then
          echo "::error::generated files reference versions other than ${want}"
          echo "$bad"
          echo "fix: go run ./scripts/bump-version -c <old> -n ${want#v} -w"
          exit 1
        fi
        echo "all generated files report ${want}"

  build:
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26.4'
    - run: go build ./...
      env:
        CGO_ENABLED: "0"
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26.4'

    - name: install gotestsum
      run: go install gotest.tools/gotestsum@latest

    - name: install sqlc-gen-test
      run: go install github.com/sqlc-dev/sqlc-gen-test@v0.1.0

    - name: install test-json-process-plugin
      run: go install ./scripts/test-json-process-plugin/

    - name: install ./...
      run: go install ./...
      env:
        CGO_ENABLED: "0"

    - name: build internal/endtoend
      run: go build ./...
      working-directory: internal/endtoend/testdata
      env:
        CGO_ENABLED: "0"

    - name: install databases
      run: go run ./cmd/sqlc-test-setup install

    - name: start databases
      run: go run ./cmd/sqlc-test-setup start

    - name: test ./...
      run: gotestsum --junitfile junit.xml -- --tags=examples -timeout 20m -failfast ./...
      env:
        CI_SQLC_PROJECT_ID: ${{ secrets.CI_SQLC_PROJECT_ID }}
        CI_SQLC_AUTH_TOKEN: ${{ secrets.CI_SQLC_AUTH_TOKEN }}
        SQLC_AUTH_TOKEN: ${{ secrets.CI_SQLC_AUTH_TOKEN }}
        POSTGRESQL_SERVER_URI: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
        MYSQL_SERVER_URI: "root:mysecretpassword@tcp(127.0.0.1:3306)/mysql?multiStatements=true&parseTime=true"
        CGO_ENABLED: "0"

  vuln_check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
    - uses: golang/govulncheck-action@v1

  ci:
    name: ci
    if: always()
    needs: [version-sync, build, test, vuln_check]
    runs-on: ubuntu-24.04
    steps:
    - name: require every job to have succeeded or been skipped
      run: |
        set -euo pipefail
        failed=0
        for result in ${{ join(needs.*.result, ' ') }}; do
          case "$result" in
            success|skipped) ;;
            *) echo "::error::a job reported: $result"; failed=1 ;;
          esac
        done
        [ "$failed" -eq 0 ] || exit 1
        echo "all jobs succeeded or were skipped"
