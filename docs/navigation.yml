# Sidebar structure for the dsqlsea documentation.
# Paths are relative to docs/ and carry no file extension, matching the routes
# generated. Add a page here when you add it to docs/ — otherwise
# it renders at its URL but never appears in the sidebar.

sections:
  - title: Overview
    items:
      - overview/install
  - title: Commands
    items:
      - howto/generate
      - howto/vet

  - title: How-to Guides
    items:
      - howto/select
      - howto/query_count
      - howto/insert
      - howto/update
      - howto/delete
      - howto/prepared_query
      - howto/transactions
      - howto/named_parameters
      - howto/dynamic_queries
      - howto/ddl
      - howto/structs
      - howto/embedding
      - howto/overrides
      - howto/rename

  - title: Reference
    items:
      - reference/changelog
      - reference/cli
      - reference/config
      - reference/datatypes
      - reference/environment-variables
      - reference/language-support
      - reference/macros
      - reference/query-annotations

  - title: Conceptual Guides
    items:
      - guides/using-go-and-pgx
      - guides/plugins
      - guides/development
      - guides/privacy

  - title: Tutorials
    items:
      - tutorials/getting-started-mysql
      - tutorials/getting-started-postgresql
      - tutorials/getting-started-sqlite

  - title: Migration Guides
    items:
      - guides/migrating-off-hosted-managed-databases
      - guides/migrating-to-sqlc-gen-kotlin
      - guides/migrating-to-sqlc-gen-python
